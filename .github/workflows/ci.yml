name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Shell syntax check (bin/ensure-daemon)
        run: sh -n bin/ensure-daemon

      - name: Byte-compile agent_pulse modules
        run: python -m py_compile agent_pulse/*.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
